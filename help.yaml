# crane's commands for astro's help browser and verbs (`astro help crane`). Generated from
# crane/commands.py by `crane help --write`; `crane help --check` fails when it drifts. Schema:
# astro_dock/.devcontainer/astro-help.py. Each run line is crane's launcher, which needs no install.
package: crane
summary: Sim and research across domains and tiers (T0 abstract, T1 dynamic, T2 unity); crane help for every command.
commands:
  - name: crane sim up
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim up
    summary: Start a domain's T2 world (the Unity player through heavy unity, plus its ROS side), or with --tier T1 its T1 world (the plant twin as a ROS node beside the same ROS side, no player), and return once the course is ready; prints the status block.
    level: core
    ros: Tools/RoboBoat/sim_up up
    notes: "Every param has a default, so the bare command runs: the default course with its realistic current, seed 1, a window only on a terminal with a display. Waits up to 60 s for the ROS endpoint and 300 s (SIM_UP_READY_S) for the course. --tier T1/T0 refuse in one line naming crane run (the batch form of those tiers). Refuses (exit 2) while a sim runs. Exit 0 ready, 1 the world failed, 2 usage or config. Everything specific comes from config/domains/DOMAIN.yaml tiers.T2. Env: ROS_DOMAIN_ID, ASTRO_STATE / MHSEALS_HARDWARE_CONFIG (passed into the ROS side), the image env, SIM_UP_*, CRANE_PLAYER, HEAVY. Same as Tools/RoboBoat/sim_up. T1 (tiers.T1.sim, Docs/SimT1.md): no Unity; a ROS node steps the plant-card twin and publishes what the player does (/crane/odom, /imu/raw, /gps/fix, /clock; /odom/mavros with --odom sensors; /odom/local, /odom/global and TF with --odom truth, which turns localization off) and drives on /thrusters/pwm."
    params:
      - {name: "--seed", type: int, default: 1, description: "The world seed: the same seed, the same course layout and buoys (default 1).", choices_from: "${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim up --list seed"}
      - {name: "--env", default: course:roboboat_2026, description: "The world, KIND:NAME (default course:roboboat_2026); --course FAMILY is the same as --env course:FAMILY.", choices_from: "${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim up --list env"}
      - {name: "--card", type: path, default: none, description: "The boat's plant: a profile JSON or a card name (default none: the player's built-in plant; --profile-json is the same)."}
      - {name: "--profile", default: interactive-low, description: The player's render and physics quality (default interactive-low).}
      - {name: "--current", default: default, description: "The water current: default (the scene's, 0.15 m/s toward 270 deg), 0 (still water, for characterization) or SPEED,TOWARD_DEG (m/s, deg).", choices_from: "${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim up --list current"}
      - {name: "--display", default: auto, choices: [auto, window, headless], description: "auto: a window on a terminal with a display, else headless (xvfb); --window and --headless are the same."}
      - {name: "--player", type: path, default: auto, description: "The Unity player to run (default auto: CRANE_PLAYER, the build, then the installed player).", choices_from: "for p in \"$CRANE_PLAYER\" \"${CRANE_DIR:-$HOME/crane_ml}/Builds/CRANE-Worker/CRANE.x86_64\" \"$HOME/.cache/crane-phase1/player/CRANE.x86_64\" \"$HOME/.local/share/crane/player/current/CRANE.x86_64\"; do [ -x \"$p\" ] && echo \"$p\"; done; true"}
      - {name: "--tier", default: T2, choices: [T2, T1, T0], description: "T2: the Unity world, real time, full sensors and ROS (default). T1: the dynamic plant-card twin, no Unity, same ROS topics, can run faster than real time. T0 (abstract) runs as batches only: crane run --tier T0.", choices_from: "${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim up --list tier"}
      - {name: "--odom", default: sensors, choices: [sensors, truth], description: "T1 only: sensors feeds the real localization like the boat (default); truth publishes perfect odometry and turns localization off."}
      - {name: "--rate", type: float, default: 1, description: "T1 only: run N times faster than real time (default 1)."}
      - {name: "--robot", default: blastoise, description: The domain's robot (default blastoise).}
      - {name: "--set", default: none, description: "Pin one course parameter, KEY=VALUE (default none; repeatable)."}
      - {name: "--domain", default: boat, description: "Which world: config/domains/DOMAIN.yaml (default boat)."}
      - {name: "--dry-run", type: bool, default: false, description: Print the resolved player argv and docker run; start nothing (default off).}
      - {name: "--json", type: bool, default: false, description: "Progress on stderr, the status as one JSON document (default off)."}
    examples:
      - crane sim up
      - crane sim up --current 0
      - crane sim up --headless --seed 3
      - crane sim up --card characterized --headless
      - crane sim up --tier T1
      - crane sim up --tier T1 --odom truth --rate 2
      - crane sim up --dry-run

  - name: crane sim down
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim down
    summary: "Stop what crane sim up started: its player's process group (TERM, KILL after 10 s) and its ROS container, nothing else."
    level: core
    ros: Tools/RoboBoat/sim_up down
    params:
      - {name: "--json", type: bool, description: One JSON document instead of the down line.}
    examples:
      - crane sim down

  - name: crane sim restart
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim restart
    summary: "Restart one part of the running world and keep the rest: nav (only the Nav2 nodes, so new nav2_limits in the state take effect), ros (the ROS container; the player stays) or player."
    level: core
    ros: docker exec CONTAINER pkill ...; docker exec -d CONTAINER ros2 launch ...
    notes: "T1: ros restarts the node with the container (from the course start), player refuses. nav stops the nav nodes named by the domain recipe (tiers.T2.ros.restart.nav) inside the ROS container, starts them again from the same launch (only:=navigation), and waits up to the recipe's ready_s (90 s) for bt_navigator to be active; a domain without the recipe refuses and names `restart ros`. ros re-runs the saved docker run, waits up to 60 s for the endpoint and 120 s for the ready nodes. player re-runs the saved player argv, waits up to 300 s (SIM_UP_READY_S) for the course. Nav goals in flight are lost. Exit 0 ok, 1 failed, 2 usage, config or nothing running, 75 timed out waiting."
    params:
      - {name: what, choices: [nav, ros, player], description: The part to restart., required: true}
      - {name: "--json", type: bool, description: One JSON document.}
      - {name: "--domain", description: config/domains/DOMAIN.yaml (default boat).}
    examples:
      - crane sim restart nav
      - crane sim restart player --json

  - name: crane sim status
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim status
    summary: The status block (mode, ROS_DOMAIN_ID, endpoint, player, ROS container, course, current, logs, next commands). Read-only.
    level: core
    ros: Tools/RoboBoat/sim_up status
    params:
      - {name: "--json", type: bool, description: One JSON document.}
    examples:
      - crane sim status

  - name: crane sim check
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim check
    summary: Is the running sim ready (player, course, plant, ROS side, nav stack)? --wait SECONDS polls until ready; CHECK INPUTS runs an offline Tools/SimCheck check.
    level: core
    ros: Tools/RoboBoat/sim_up check
    params:
      - {name: "--wait", type: int, description: Poll every 2 s until ready or this many seconds pass.}
      - {name: "--json", type: bool, description: One JSON document.}
      - {name: "--domain", description: config/domains/DOMAIN.yaml (default boat).}
    examples:
      - crane sim check --wait 120

  - name: crane sim logs
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane sim logs
    summary: "The last lines of the player, player stdout and ROS logs (T1: the node and ROS logs), each under its path."
    level: setup
    ros: Tools/RoboBoat/sim_up logs
    params:
      - {name: which, type: list, choices: [player, stdout, ros, t1], description: Which logs (default the running tier's)., required: false}
      - {name: "-n", type: int, default: 40, description: Lines per log.}
    examples:
      - crane sim logs ros -n 100

  - name: crane run
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane run
    summary: Run episodes at a tier, one run dir per seed (OUT/VARIANT/s<seed>). T0 abstract and T1 dynamic; T2 is not yet available (use crane sim up). Missing scenarios are generated on demand.
    level: setup
    ros: python3 -m fastsim.batch --config CONFIG --seeds 0:3 --out OUT
    params:
      - {name: "--domain", description: "A domain: config/domains/DOMAIN.yaml (boat, sub, drones, modular, toy)."}
      - {name: "--config", type: path, description: "A fastsim domain YAML, used as is."}
      - {name: "--tier", choices: [T0, T1, T2, abstract, dynamic, unity], description: "The tier (default: the domain's first tier, T0 with --config)."}
      - {name: "--seeds", description: "N, A:B (B exclusive), a,b,c, @FILE or block:NAME (required, except with --astro-test: 0)."}
      - {name: "--out", type: path, description: Output root; runs go to OUT/VARIANT/s<seed> (default ~/.cache/crane/runs/DOMAIN/TIER/STAMP).}
      - {name: "--workers", type: int, description: Worker processes (default the config's workers).}
      - {name: "--set", description: "Override a config key; dotted keys nest, the value is YAML (repeatable)."}
      - {name: "--variant", default: base, description: The name of this design or parameter set.}
      - {name: "--generate", type: bool, description: Regenerate the seeds' scenarios (missing ones are always made).}
      - {name: "--allow-dirty", type: bool, description: Run an adapter tree with uncommitted changes.}
      - {name: "--force", type: bool, description: Move a run dir holding another run (or an incomplete one) to <dir>.stale-N and rerun it; without it such a dir is refused and matching ones are reused.}
      - {name: "--engine", default: fastsim, choices: [fastsim, batched], description: "fastsim: one scalar episode per seed; batched: every seed at once on the batched engine (Docs/Engine.md)."}
      - {name: "--backend", default: numba, choices: [numpy, numba, jax], description: "With --engine batched: numpy (float64 reference), numba (every core) or jax (GPU)."}
      - {name: "--dtype", choices: [float64, float32], description: "With --engine batched: default float64; jax on a consumer GPU wants float32 (bench/RESULTS.md)."}
      - {name: "--record", type: int, description: "With --engine batched: also write traj.ctraj with every K-th track row (default: run.json, events.jsonl, metrics.json only)."}
      - {name: "--replay", type: path, description: "A domain whose tier replays logged command timelines (modular): an npz of cmd [M, T, 3]; every seed replays every timeline."}
      - {name: "--robot", description: "The domain's robot (modular: an assembly, default the domain's)."}
      - {name: "--env", description: "The world (modular: route:NAME or route:random)."}
      - {name: "--astro-test", description: "An astro test or group (still, couple-*, speed-*, steps-*, nav2, all) at T0/T1, with metrics named as astro's result fields."}
      - {name: "--card", description: "A profile JSON or a name in the domain's card dir, bound to its card.keys (config/domains/D.yaml); with --astro-test also a plant card or a factorial manifest; modular: a profile, REF#VARIANT for one plate state (repeatable)."}
      - {name: "--tests", type: path, description: "With --astro-test: astro's tests file or a bundle holding one."}
      - {name: "--space", description: "With --astro-test: the tests file's space (default large)."}
      - {name: "--amp", type: float, description: "With --astro-test: the effort amplitude (default the space's)."}
      - {name: "--json", type: bool, description: One summary document.}
      - {name: "--dry-run", type: bool, description: Print the resolved plan; run nothing.}
      - {name: "--quiet", type: bool, description: Only results and failures.}
    examples:
      - crane run --domain toy --seeds 0:3
      - crane run --domain boat --tier T1 --seeds 0:2 --out /tmp/runs
      - crane run --domain sub --tier T1 --engine batched --seeds 0:64
      - crane run --domain boat --tier T1 --astro-test speed-surge --card /tmp/fit/profile.json
      - "crane run --domain modular --replay timelines.npz --seeds 0:24 --card example#plated"

  - name: crane card show
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane card show
    summary: "A plant card: one row per block (parameters with their sd and status) and the validation rows."
    level: setup
    ros: python3 -m plantcard show
    params:
      - {name: ref, description: "FAMILY/ROBOT@HEAD, a sha prefix or a card dir (default: plantcard's default card).", required: false}
      - {name: "--json", type: bool, description: The card as one JSON document.}
    examples:
      - crane card show
      - crane card show FAMILY/ROBOT@HEAD --json

  - name: crane card export
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane card export
    summary: One of a card's tier views (unity | nlc | control | fastsim) as JSON.
    level: setup
    ros: python3 -m plantcard export
    params:
      - {name: view, choices: [unity, nlc, control, fastsim], description: The tier view., required: true}
      - {name: ref, description: "The card (default: plantcard's default card).", required: false}
      - {name: "--out", type: path, description: Write the JSON here.}
    examples:
      - crane card export fastsim --out /tmp/card.json

  - name: crane fit
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane fit
    summary: An astro bundle to a profile (through the gate) and a plant card (through its bags as evidence); prints each parameter's status and why.
    level: core
    ros: python3 -m Tools.Characterization.from_bundle
    notes: Writes OUT/profile.json (sim_up --profile-json), OUT/profile.gate.json, OUT/cards and OUT/fit.json. A bundle made without --bags gives the gate only; --bags DIR reads bags beside it. --factorial SPEC.yaml writes card variants and a manifest.
    params:
      - {name: bundles, type: list, description: Astro bundles (.tgz); each is one session., choices_from: "ls -1t ${ASTRO_DATA:-$HOME/astro_dock/bags}/*/bundle-*.tgz ${ASTRO_DATA:-$HOME/astro_dock/bags}/*/*/bundle-*.tgz 2>/dev/null | head -n 30", required: false}
      - {name: "--out", type: path, description: "Output dir (default BUNDLE.fit/ beside the first bundle, else ~/.cache/crane/fit/BUNDLE/ when that is not writable)."}
      - {name: "--bags", type: path, description: A bag dir to read besides the bundle (read only; repeatable).}
      - {name: "--base", description: The base profile the gate imports into (default Ideal).}
      - {name: "--robot", description: The card's robot name (default astro/<state file stem>).}
      - {name: "--n", type: int, default: 64, description: Rollouts per held-out segment.}
      - {name: "--no-card", type: bool, description: "Stop after the gate (no evidence, no card)."}
      - {name: "--factorial", type: path, description: Card variants from a spec (measured vs prior levels per property).}
    examples:
      - crane fit bundle-173031.tgz --bags ~/astro_dock/bags/sim/2026-11-24/bags --out /tmp/fit

  - name: crane field import
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane field import
    summary: "A bundle (made with --bags), a bag dir or an .mcap file to crane.run/1 records: odometry trajectory, /events and log.txt lines, frame and clock."
    level: setup
    params:
      - {name: source, type: path, description: "A bundle, a rosbag2 dir or an .mcap file.", required: true}
      - {name: "--out", type: path, description: The run dir (one bag) or the root (several)., required: true}
      - {name: "--odom", default: /odom/local, description: The odometry topic.}
      - {name: "--events", default: /events, description: The astro events topic.}
      - {name: "--frame", description: ID=enu|ned for an odometry frame id that is not a REP 103/105 name. (repeatable)}
      - {name: "--hz", type: float, default: 20.0, description: The trajectory rate (Hz).}
      - {name: "--domain", default: boat, description: The run's domain.}
    examples:
      - crane field import ~/astro_dock/bags/sim/2026-11-24/bags/171208-smoke --out /tmp/field

  - name: crane compare
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane compare
    summary: "Two run sets as a Markdown table and JSON: variant A/B on one frame and clock, tier gap (--tiers) or field vs sim per astro test (--field BUNDLE RUNS)."
    level: core
    params:
      - {name: runs, type: list, description: "Two run sets, A then B; with --field, the sim runs.", choices_from: "ls -1td ${CRANE_RUNS:-$HOME/.cache/crane/runs}/*/*/*/*/s* 2>/dev/null | head -n 30", required: true}
      - {name: "--tiers", type: bool, description: "A is the lower tier, B the higher."}
      - {name: "--field", type: path, description: An astro bundle to compare the runs against.}
      - {name: "--metric", description: Only these metrics (repeatable).}
      - {name: "--direction", default: higher, choices: [higher, lower], description: "--tiers: better is higher or lower."}
      - {name: "--band", type: float, description: "--tiers: the allowed |low - high| gap (metric units)."}
      - {name: "--fidelity", type: path, description: "--tiers: also replay B's goal windows on CONFIG's vehicle."}
      - {name: "--bounds", description: "--field: pass/FAIL per row against config/fidelity/DOMAIN.yaml ('file') or FILE, and the fit's gate; a verdict line, exit 1 on FAIL ('card': not yet available)."}
      - {name: "--fit", type: path, description: "--bounds: the `crane fit --out` dir whose gate is required (default fit-<bundle>)."}
      - {name: "--domain", default: boat, description: "--bounds: config/fidelity/DOMAIN.yaml."}
      - {name: "--out", type: path, description: Write compare.json and compare.md here.}
      - {name: "--json", type: bool, description: "One JSON document: {schema, kind, result}; with --bounds, result holds rows, gate and verdict."}
    examples:
      - crane compare --field bundle-173031.tgz runs/sim
      - crane compare --field bundle-173031.tgz runs/sim --bounds file --fit /tmp/fit

  - name: crane view
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane view
    summary: The native sandbox window. Replay runs overlaid in one frame and clock, or run a T0/T1 sim live with sliders, rerun from t, and Promote to a crane run spec. --screenshot renders offscreen (no window).
    level: core
    params:
      - {name: runs, type: list, description: "crane.run/1 dirs, fastsim run dirs or .ctraj files.", choices_from: "ls -1td ${CRANE_RUNS:-$HOME/.cache/crane/runs}/*/*/*/*/s* 2>/dev/null | head -n 30", required: false}
      - {name: "--live", type: bool, description: "Run the sim in-process (with --domain, --tier T0|T1, --seed)."}
      - {name: "--domain", default: boat, description: "live: the domain."}
      - {name: "--tier", default: T1, choices: [T0, T1, abstract, dynamic], description: "live: the tier."}
      - {name: "--seed", type: int, description: "live: the scenario seed."}
      - {name: "--offset", description: "Run 2, 3, ...: the first run's time of its t = 0. (repeatable)"}
      - {name: "--transform", description: "Run 2, 3, ...: {from, to, xyz, yaw} mapping its origin onto the first run's. (repeatable)"}
      - {name: "--3d", type: bool, description: Open in the 3-D view (6-DOF records).}
      - {name: "--screenshot", type: path, description: Render offscreen to this PNG and exit.}
      - {name: "--at", type: float, description: "Screenshot: the playhead time (s; default the end)."}
      - {name: "--promote-dir", type: path, default: runs/promoted, description: Where Promote writes specs.}
    examples:
      - crane view --live --domain boat --tier T1 --seed 3
      - crane view /tmp/runs/base/s3 --screenshot /tmp/view.png --at 60

  - name: crane board
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane board
    summary: The web replay board over local runs (crane.run/1 records and .ctraj), courses and judge reports; prints its URL.
    level: setup
    ros: python3 -m viewer serve
    params:
      - {name: roots, type: list, description: Dirs to index (default .)., required: false}
      - {name: "--port", type: int, default: 8765, description: Local port.}
      - {name: "--host", default: 127.0.0.1, description: The address to bind.}
    examples:
      - crane board /tmp/runs

  - name: crane bench player
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane bench player
    summary: "The Unity player real-time factor: one worker, or a sweep over worker counts, through heavy unity."
    level: setup
    ros: bin/heavy unity Tools/Bench/sweep_workers.sh 1 2 4
    params:
      - {name: "--worker", type: int, description: Run one worker with this id.}
      - {name: "--sweep", type: list, description: Worker counts to sweep (default config/bench.yaml).}
    examples:
      - crane bench player --sweep 1 2 4

  - name: crane bench fast
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane bench fast
    summary: "Fast-tier throughput: the scalar table B, the batched engine (--engine batched) or the gate-3 equivalence report (--equivalence)."
    level: setup
    ros: python3 -m bench.fast
    params:
      - {name: args, type: list, description: "bench.fast's options (python3 -m bench.fast --help): --domain, --tier, --seeds, --engine batched, --backend, --E, --out, --equivalence.", required: false}
    examples:
      - crane bench fast --engine batched --domain boat --tier T1 --backend numba,jax --E 1024,4096 --out /tmp/bench
      - crane bench fast --equivalence --tier T1 --seeds 0:500
      - crane bench fast --domain boat --tier T1 --seeds 0:50 --out /tmp/b

  - name: crane build player
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane build player
    summary: Build the headless Linux player through heavy unity and stamp its manifest with the source commit.
    level: setup
    notes: Needs the project's Unity editor. --skip-unity only stamps and packs an existing Builds/CRANE-Worker.
    params:
      - {name: "--tarball", type: bool, description: Also write the player tarball and its .sha256.}
      - {name: "--skip-unity", type: bool, description: Stamp and pack an existing build only.}
      - {name: "--editor", type: path, default: auto, description: "The Unity editor (default UNITY_EDITOR, else the ProjectVersion.txt editor)."}
      - {name: "--builds", type: path, description: The Builds dir (default <repo>/Builds).}
      - {name: "--dry-run", type: bool, description: Print the Unity command and stop.}
    examples:
      - crane build player --tarball

  - name: crane deploy
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane deploy
    summary: "Bring a host up to this checkout over ssh: check its disk, sync the code (git fetch from this machine + ff-only, or rsync when it has no checkout), make its .venv (install.sh), send the T2 player with --player (sha256 checked there, current + prev kept), then run crane doctor there."
    level: setup
    ros: ssh HOST 'cd ~/crane_ml && git fetch ssh://THISHOST/REPO main && git merge --ff-only FETCH_HEAD'
    notes: Touches only ~/crane_ml, ~/.local/bin/crane and the player store (~/.local/share/crane/player) on HOST. Refuses (exit 2) when HOST has less free space than the player (tarball and unpacked) plus 1 GB, when its checkout cannot fast-forward, or when ~/crane_ml there is neither a crane checkout nor an earlier deploy. The .venv step runs install.sh --yes --no-clone --components LIST there (uv, Python 3.12) when HOST has no .venv or --components is given. The player tarball is --tarball, else the newest Builds/crane-player-*.tar.* with its .sha256 (a warn row when its commit is not the code's), else the release player; rsync --partial resumes a cut transfer. HOST fetches the full commit from --from (default ssh://THISHOST/REPO, CRANE_DEPLOY_FROM). local:DIR deploys into DIR as the home (no ssh; for tests). Exit 0 ok, 1 a step or the remote doctor failed, 2 usage or a refusal.
    params:
      - {name: host, description: "HOST or USER@HOST for ssh, or local:DIR.", required: true}
      - {name: "--player", type: bool, description: Also send and install the T2 player.}
      - {name: "--tarball", type: path, description: The player tarball (implies --player).}
      - {name: "--ref", default: HEAD, description: "The branch or commit HOST gets (default HEAD, this checkout's commit)."}
      - {name: "--components", description: "The host .venv's components, through install.sh --yes --no-clone (default core; run when HOST has no .venv, or when given)."}
      - {name: "--no-venv", type: bool, description: Skip the .venv step.}
      - {name: "--from", description: The git URL HOST fetches from (default ssh://THISHOST/REPO).}
      - {name: "--dry-run", type: bool, description: Probe HOST and print the plan; change nothing.}
      - {name: "--json", type: bool, description: One JSON document.}
    examples:
      - crane deploy HOST --dry-run
      - crane deploy HOST --player
      - crane deploy HOST --components core,fast --player

  - name: crane update
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane update
    summary: Update this checkout (git fetch + ff-only) or this install (the release wheel), then the T2 player from the release into the player store (sha256 checked, current + prev kept).
    level: setup
    ros: git fetch && git merge --ff-only @{u}; curl -LO RELEASE/ASSET; sha256sum -c
    notes: The release is release.json of the latest GitHub Release, or of v<VERSION> (CRANE_RELEASES overrides the base URL or names a local dir laid out the same way). A checkout with no release yet still fast-forwards. Refuses (exit 2) when the store's disk has less free space than the player (tarball and unpacked) plus 1 GB. Exit 1 when a file fails its sha256 check. --tarball installs a local player tarball (crane deploy runs it on the host).
    params:
      - {name: "--version", description: That release (default the latest); a checkout fast-forwards to its tag vX.Y.Z.}
      - {name: "--player-only", type: bool, description: Only the player.}
      - {name: "--no-player", type: bool, description: Only the code.}
      - {name: "--tarball", type: path, description: Install this local player tarball instead of the release's.}
      - {name: "--sha256", description: "--tarball's digest (default its .sha256 file)."}
      - {name: "--store", type: path, description: The player store (default ~/.local/share/crane/player).}
      - {name: "--dry-run", type: bool, description: Print the steps; change nothing.}
      - {name: "--json", type: bool, description: One JSON document.}
    examples:
      - crane update
      - crane update --dry-run
      - crane update --version 0.3.0 --player-only

  - name: crane doctor
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane doctor
    summary: Check this machine (python, extras, the T2 player and its flags, heavy, astro_dock, GPU) and print the next commands.
    level: core
    notes: Read-only; safe any time. Exit 1 only when the core (python >= 3.10, numpy, pyyaml) is broken.
    params:
      - {name: "--json", type: bool, description: One JSON document.}
      - {name: "--quiet", type: bool, description: Only results and failures.}
    examples:
      - crane doctor

  - name: crane setup
    run: ${CRANE_DIR:-$HOME/crane_ml}/bin/crane setup
    summary: "The setup wizard: detect this machine, choose components and domains, show sizes and times, install them (install.sh, the release player), then run crane doctor."
    level: setup
    ros: ./install.sh --yes --components core,fast; crane update --player-only
    notes: "Interactive with rich and questionary (the [setup] extra), else plain prompts; --yes takes the defaults or --components/--domains and asks nothing. Components: core, fast, gpu, view, field, data (pip extras, through install.sh), player (the release player, crane update --player-only), astro (a read-only check of the astro integration). The choices are saved to ~/.config/crane/setup.json. Never builds astro images or workspaces (astro owns those)."
    params:
      - {name: "--yes", type: bool, description: "Ask nothing: the defaults, or the lists given."}
      - {name: "--components", default: auto, description: "Comma list (default core, plus fast on a multicore box, gpu with an NVIDIA driver, player with a display or astro_dock)."}
      - {name: "--domains", description: Comma list of config/domains names (default all).}
      - {name: "--dry-run", type: bool, description: Detect and plan; install nothing.}
      - {name: "--json", type: bool, description: One JSON document (implies --yes).}
    examples:
      - crane setup
      - crane setup --yes --components core,fast,player --domains boat
      - crane setup --yes --dry-run
