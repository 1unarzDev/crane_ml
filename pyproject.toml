# crane: the research and testing CLI over this Unity project (`crane <verb>`, crane/README.md), and the
# research-cluster plugin: `pip install -e .` registers crane's backends by entry point (crane_backends/__init__.py).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crane"
version = "0.2.0"
description = "crane: one CLI for sim and research across domains and tiers; the research-cluster backends"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
fast = ["numba"]
gpu = ["jax[cuda12]"]
view = ["PySide6", "pyqtgraph", "PyOpenGL"]
field = ["mcap", "mcap-ros2-support"]
setup = ["rich", "questionary"]
all = ["crane[fast,gpu,view,field,setup]"]

[project.scripts]
crane = "crane.cli:main"

[project.entry-points."research_cluster.backends"]
fastsim = "crane_backends.fastsim:ClusterBackend"
unity = "crane_backends.unity:ClusterBackend"
theater-render = "crane_backends.theater:ClusterBackend"
crane-command = "crane_backends.command:ClusterBackend"

[tool.setuptools.packages.find]
include = ["crane*", "crane_backends*", "fastsim*", "theater*", "plantcard*", "judge*", "viewer*", "domains*", "bench*", "engine*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.js", "*.html", "*.css"]

# `python3 -m pytest` at the root collects every suite. importlib mode lets same-named test modules (test_core.py,
# test_cli.py, test_record.py) live in several suites; each suite's conftest still puts its own folder on sys.path.
# The root conftest.py marks tests that need a host tool and skips them with one line when it is absent.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p no:cacheprovider"
pythonpath = ["."]
testpaths = [
    "tests", "fastsim/tests", "judge/tests", "plantcard/tests", "theater/tests", "viewer/tests",
    "crane_backends/tests", "domains/boat/tests", "Tools/Characterization", "Tools/SimCheck/tests",
    "Tools/RoboBoat/tests",
]
markers = [
    "dotnet: needs the .NET SDK its global.json pins",
    "node: needs node",
    "docker: needs a reachable docker daemon",
    "cluster: needs research-cluster's crane_cluster (RESEARCH_CLUSTER or ~/research-cluster)",
    "display: needs the [view] extra (PySide6, pyqtgraph); renders offscreen",
]

# A lenient baseline that passes today: syntax errors, undefined names and broken comparisons everywhere, unused
# imports in crane/ only. Tighten by adding a rule family to `select` (e.g. "F" then "E4", "E7", "B"), running
# `uvx ruff@0.12.5 check --fix .` and reviewing the diff, and by shrinking the per-file ignores.
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["Assets", "Packages", "ProjectSettings", "Library", "Builds", "Logs", "Temp", "PerformanceResults"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
"!crane/**" = ["F401"]
"crane/view/live.py" = ["F401"]   # an unused `World` import; drop this line once it is removed
