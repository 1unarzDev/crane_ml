# Stale drift estimate under way (observer off, drift_time_constant 0): does the PI integral ceiling hold the line?
seeds: [0, 1, 2]
tests: [route, turn]
base: {variant: {current: [0.0, 0.3]}}
cases:
  - {name: observer_on_il0.3, hw: {characterized: true}}
  - {name: stale_il0.3, hw: {characterized: true, controller: {drift_time_constant: 0.0}}}
  - {name: stale_il0.5, hw: {characterized: true, controller: {drift_time_constant: 0.0, integral_limit: [0.5, 0.5, 0.3]}}}
  - {name: stale_il0.8, hw: {characterized: true, controller: {drift_time_constant: 0.0, integral_limit: [0.8, 0.8, 0.3]}}}
  - {name: stale_il0.5_c0.45, variant: {current: [0.0, 0.45]}, hw: {characterized: true, controller: {drift_time_constant: 0.0, integral_limit: [0.5, 0.5, 0.3]}}}
  - {name: stale_il0.3_c0.45, variant: {current: [0.0, 0.45]}, hw: {characterized: true, controller: {drift_time_constant: 0.0}}}
