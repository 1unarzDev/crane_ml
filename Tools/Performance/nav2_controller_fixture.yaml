controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /crane/odom
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      use_rotate_to_heading: true
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      update_frequency: 10.0
      publish_frequency: 2.0
      width: 20
      height: 20
      resolution: 0.10
      robot_radius: 0.80
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: -2.0
        z_resolution: 0.25
        z_voxels: 16
        max_obstacle_height: 3.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -1.5
          max_obstacle_height: 3.0
          obstacle_min_range: 1.0
          obstacle_max_range: 20.0
          raytrace_min_range: 1.0
          raytrace_max_range: 25.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: false

lifecycle_manager_controller:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names: [controller_server]
