# Defaults for run_sim.sh and rigq. Flags override the first block; the rest is
# behaviour the rig reads but no flag needs to change.
#
# Host-specific values are not in this file: set them in rig.local.yaml next to it (gitignored;
# see rig.local.example.yaml) or $CRANE_RIG_LOCAL, or through the ${VAR} defaults below.

# Private-IPC, --init container the rig creates (container.sh up); never the dev container,
# whose host /dev/shm Fast DDS state wedges.
container: ${CRANE_RIG_CONTAINER:-crane_rig}
container_image: ${CRANE_RIG_IMAGE:-}         # the roboboat dev image with ROS jazzy
container_mounts: []                          # host:container[:ro], e.g. the ctest installs
player: ${CRANE_RIG_PLAYER:-}                 # Builds/<name>/CRANE.x86_64 (CranePerformanceBuild)
player_commit: ''   # recorded when the build manifest has no sourceCommit
courses_dir: ${CRANE_RIG_COURSES:-}           # crane Tools/RoboBoat/courses of the player's branch
# Host copy of the profiles in the install below (read for the stack's start components).
profiles_dir: ${CRANE_RIG_PROFILES:-}         # mhseals_testing config/profiles
sessions_dir: ${XDG_STATE_HOME:-~/.local/state}/crane-rig/sessions
course: roboboat_2025
profile: crane_full_stack
duration: 30            # seconds of recording after the course is ready
# Without --domain a run takes the first free domain in this range (host lock files) and port
# 10000 + domain. At most max_instances rig runs (any caller) share the machine; the rest wait.
# The lock files in lock_dir are shared with every other rig copy on the host.
domains: [200, 231, 232]   # never 201-230 (210-230 are the tests'); rigq passes its own queue.domains
max_instances: 3
lock_dir: /tmp
run_log: ${XDG_STATE_HOME:-~/.local/state}/crane-rig/runs.jsonl   # one JSON line per run
seed: 0                 # --crane-seed and --crane-contract-seed: course jitter, wind gusts, sensor noise
# effort: the command topic drives thruster_pwm_node (open-loop drive); velocity: the harness chain
# (calibrated_velocity_controller, plus command_mux on a muxed profile) as boat_test arms it.
mode: effort
# Hardware YAML for the driver chain; 'sim' is the install's config/sim/hardware_crane.yaml.
hardware: sim
nice: 10

# Player. The NVIDIA Vulkan device needs an X display even with -batchmode.
display: ${CRANE_RIG_DISPLAY:-:1}
scene: Roboboat Course
runtime_profile: train-gpu   # interactive-low adds RGB camera images
ready_timeout: 120           # seconds to wait for CRANE_ROBOBOAT_COURSE_READY
player_args:
  - --crane-disable-sitl
  - --crane-ros-thruster-pwm
  - --crane-roboboat-contract
  - --crane-ros-nav-state

# Stack inside the container. The base install is sourced, then --overlay.
# ctest overlay 'simrig': base (origin/main) + mhseals_hardware origin/main + mhseals_testing sim-stack.
install: ${CRANE_RIG_INSTALL:-/home/roboboat/.cache/ctest/simrig/install}
driver: true                 # thruster_pwm_node, output_backend topic

record:
  - /clock
  - /crane/odom
  - /odom/mavros
  - /odom/local
  - /imu/raw
  - /gps/fix
  - /thrusters/pwm
  - /cmd_vel
  - /detections
  - /cmd_vel_nav
  - /rosout
  - /parameter_events
  - /navigate_to_pose/_action/status
  - /plan
  - /cmd_vel/applied
  - /cmd_vel_effort
  - /task/events
  - /task/status
  - /tf
  - /tf_static
  - /objects/map

# Default open-loop drive: [seconds, surge, sway, yaw] effort segments, on drive_topic (null: the
# profile's command topic). On a muxed profile command_mux holds /cmd_vel, so that drive stays
# static (the watchdog's no_motion); /cmd_vel/manual outranks the hold.
drive_topic: null
drive:
  - [3, 0.0, 0.0, 0.0]
  - [6, 0.6, 0.0, 0.0]
  - [4, 0.0, 0.0, 0.3]
  - [3, 0.0, 0.0, 0.0]

# Smoke gates over the recorded bag (check.py).
smoke:
  min_hz: {/clock: 20, /crane/odom: 20, /odom/mavros: 10, /imu/raw: 10, /gps/fix: 2,
           /odom/local: 5, /thrusters/pwm: 5}
  span_topics: [/clock, /odom/mavros]   # must cover min_span_frac of the duration
  min_span_frac: 0.9
  min_travel_m: 1.0          # /crane/odom displacement while driving
  min_active_pwm: 10         # /thrusters/pwm messages away from neutral
  neutral_us: 1500
  pwm_band_us: 25

# Sim lidar smear (mhseals_nav lidar_smear): true remaps the endpoint cloud to /points/instant and smears it onto /points. Off by default.
lidar_smear: false

# Named drives for run_sim --drive NAME / rigq submit --drive NAME: topic and schedule.
drives:
  manual_surge:          # straight ahead through the mux's manual input
    topic: /cmd_vel/manual
    schedule: [[3, 0.0, 0.0, 0.0], [12, 0.6, 0.0, 0.0], [3, 0.0, 0.0, 0.0]]
  manual_turn:
    topic: /cmd_vel/manual
    schedule: [[3, 0.0, 0.0, 0.0], [6, 0.6, 0.0, 0.0], [4, 0.0, 0.0, 0.3], [3, 0.0, 0.0, 0.0]]
  auto_surge:            # the command topic itself: static on a muxed profile (held)
    topic: /cmd_vel
    schedule: [[3, 0.0, 0.0, 0.0], [12, 0.6, 0.0, 0.0], [3, 0.0, 0.0, 0.0]]

# In-run progress probe (probe.py in the container): writes progress.json for the watchdog.
probe: true

# rigq watchdog defaults; a job overrides any of them (rigq submit --help).
watchdog:
  hard_margin_s: 420     # hard timeout = duration + this
  startup_s: 240         # no probe data this long after launch: no_start
  stall_s: 30            # no new sim time and no new topic data this long: stalled
  post_s: 300            # post-processing (referee, smoke, copy) longer than this: post_timeout
  motion_grace_s: 10     # seconds of non-zero command before the boat must have moved
  min_travel_m: 0.5
  expect_motion: false   # true: must move within motion_grace_s of ready even with no command seen
  clock_topic: /clock
  odom_topic: /crane/odom
  command_topics: [/cmd_vel, /cmd_vel/manual, /cmd_vel_nav]

# rigq: file-based queue and worker.
queue:
  dir: ${XDG_STATE_HOME:-~/.local/state}/crane-rig/queue
  slots: 3               # concurrent sim jobs from this queue (the host cap max_instances still applies)
  builders: 2            # concurrent build jobs (Unity player builds) on the host
  domains: 180-199       # ROS_DOMAIN_ID pool: <= 232, never 201-230
  poll_s: 1
  grace_s: 20            # TERM to KILL
