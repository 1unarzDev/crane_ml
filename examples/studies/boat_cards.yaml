# Boat card factorial at T1: two plant cards (named sources pre/measured) x a heading-gain source x every row of a
# condition table x 2 seeds. Conditions split by their `split` column: calib runs now, test is held out until the
# targets file is committed and the run says --confirm. The values here are illustrative, not study parameters.
#   crane study plan examples/studies/boat_cards.yaml
#   crane study run examples/studies/boat_cards.yaml --block calib --max-workers 8
#   crane study run examples/studies/boat_cards.yaml --block test --confirm
schema: crane.study/1
name: boat_cards
domain: boat
tier: T1
arms:
  pre: {card: ideal}                  # Tools/Characterization/profiles/ideal.json
  measured: {card: characterized}     # Tools/Characterization/profiles/characterized.json
axes:
  gain:                               # named sources: each level is a value set
    levels:
      pre: {vehicle.gain: 1.0}
      measured: {vehicle.gain: 0.85}
conditions:
  csv: boat_conditions.csv            # one condition per row
  id: id
  set: {range_m: perception.range_m, time_limit_s: time_limit_s}
splits: {column: split, roles: {calib: calib, test: held-out}}
seeds:
  check: {role: check, seeds: '0:2'}
targets: boat_cards.targets.yaml
baseline: pre
scorer: scorers.py:boat
metrics: [succeeded, run.sim_s, run.contacts, run.min_clearance_m]
record: {level: traj_decimated, hz: 20, until_s: 12}   # the calibration window: 20 Hz for the first 12 s
pack: {unit_s: 1.5, target_s: 900}
campaign: boat-cards
purpose: Boat plant-card factorial at T1 over a condition table, the crane.study/1 example with a held-out split.
expect: measured card tracks the calibration conditions at least as well as the pre card
pin: {tags: [cloud-ok]}
