name: CI

# Every PR and every push to main. One landing gate (`gate`) must pass; the other jobs report and never block.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_PIN: pytest==8.3.5
  RUFF_PIN: ruff==0.12.5
  IMAGE: lunarzdev/crane

jobs:
  # The landing gate: lint, shell syntax, the contracts and every suite on 3.12. Only this job blocks.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crane (core) and the test tools
        run: python -m pip install --quiet -e . "$PYTEST_PIN" "$RUFF_PIN"
      - name: Lint (the ruff baseline in pyproject.toml)
        run: ruff check --output-format concise .
      - name: Shell syntax (bash -n on every tracked shell script)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            case $f in
              *.sh) ;;
              *) head -n1 "$f" | grep -qE '^#!.*\b(bash|sh)\b' || continue ;;
            esac
            if bash -n "$f"; then echo "ok    $f"; else echo "FAIL  $f: bash -n $f"; fail=1; fi
          done < <(git ls-files -z -- ':!:Assets' ':!:Packages' ':!:ProjectSettings')
          exit $fail
      - name: Contracts (tests/test_contracts.py)
        run: python -m pytest -q tests/test_contracts.py
      - name: Every suite (the root pytest)
        run: python -m pytest -q -rs
      - name: help.yaml matches the commands
        # TODO: drop `|| true` once `crane help --check` exists (the W1 CLI work); until then it may not parse.
        run: crane help --check || true

  # The full suite on both supported Pythons: reported, never blocking.
  pytest:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet -e . "$PYTEST_PIN"
      - run: python -m pytest -q -rs

  # install.sh as a rented box runs it: root, headless, python:3.12-slim, core only.
  install-smoke:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    container: python:3.12-slim
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --yes --no-clone --components core (bounded at 5 min)
        run: timeout 300 ./install.sh --yes --no-clone --components core
      - name: crane doctor
        run: '"$HOME/.local/bin/crane" doctor'

  # crane:core (Dockerfile.core): built and smoke-tested on every run; pushed as core-<sha> on main only, never :latest.
  image:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      HAVE_HUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build crane:core without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.core
          platforms: linux/amd64
          push: false
          load: true
          tags: crane:core-ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
      - name: Smoke-test crane:core (imports, CLI, boot.sh tools, size)
        run: |
          docker run --rm crane:core-ci python -c 'import crane_backends.fastsim, fastsim, judge.stats'
          docker run --rm crane:core-ci crane --help >/dev/null
          docker run --rm crane:core-ci sh -c 'for c in /usr/sbin/sshd ssh rsync git curl ps zstd; do command -v "$c" >/dev/null || { echo "missing $c"; exit 1; }; done'
          test -z "$(docker inspect crane:core-ci --format '{{join .Config.Entrypoint " "}}')" || { echo "crane:core has an ENTRYPOINT"; exit 1; }
          mb=$(( $(docker save crane:core-ci | gzip -1 | wc -c) / 1000000 ))
          echo "crane:core ${mb} MB compressed (limit 300 MB)"
          test "$mb" -lt 300
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAVE_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push lunarzdev/crane:core-<sha>
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAVE_HUB == 'true'
        run: |
          docker tag crane:core-ci "$IMAGE:core-$GITHUB_SHA"
          docker push "$IMAGE:core-$GITHUB_SHA"
