# crane-server on one host. Secrets and settings in .env next to this file (deploy/creation.sh writes it, mode 600):
#   ADMIN_TOKEN, GITHUB_WEBHOOK_SECRET, ARCHIVE_URL, ARCHIVE_ACCESS_ID, ARCHIVE_ACCESS_SECRET, CRANE_IMAGE, ...
# The port is bound to loopback: cloudflared on the host publishes it (crane.lunarz.dev after the cutover).
name: crane
services:
  coordinator:
    image: ${CRANE_IMAGE:-crane-server:local}
    build:
      context: ../..
      dockerfile: cluster/server/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
    ports:
      - "127.0.0.1:${CRANE_PORT:-8787}:8787"
    volumes:
      - crane-data:/data
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
volumes:
  crane-data:
