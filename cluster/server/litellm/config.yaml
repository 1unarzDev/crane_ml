# LiteLLM proxy on the server (compose.yaml here). One OpenAI-compatible endpoint for local Ollama on the mesh and
# the hosted APIs. Keys come from the environment at deploy (.env, mode 600); nothing secret is in this file.
#   local/*      Ollama on innovation and simwin over the mesh; both serve the same names, so requests are spread
#                across whichever is up (a host that fails is cooled down for 60 s). Off while the ALD Ollama
#                workers are paused; Ollama must listen on the mesh address (OLLAMA_HOST=0.0.0.0:11434).
#   openrouter/<vendor>/<model>, groq/<model>, gemini/<model>   the providers' own model names, passed through.
model_list:
  - model_name: local/qwen3.5-9b
    litellm_params: { model: ollama_chat/qwen3.5:9b-q4_K_M, api_base: os.environ/OLLAMA_INNOVATION_URL }
  - model_name: local/qwen3.5-9b
    litellm_params: { model: ollama_chat/qwen3.5:9b-q4_K_M, api_base: os.environ/OLLAMA_SIMWIN_URL }
  - model_name: local/qwen3.5-4b
    litellm_params: { model: ollama_chat/qwen3.5:4b-q4_K_M, api_base: os.environ/OLLAMA_INNOVATION_URL }
  - model_name: local/qwen3.5-4b
    litellm_params: { model: ollama_chat/qwen3.5:4b-q4_K_M, api_base: os.environ/OLLAMA_SIMWIN_URL }
  - model_name: local/gemma4-12b
    litellm_params: { model: ollama_chat/gemma4:12b-it-q4_K_M, api_base: os.environ/OLLAMA_INNOVATION_URL }
  - model_name: local/gemma4-12b
    litellm_params: { model: ollama_chat/gemma4:12b-it-q4_K_M, api_base: os.environ/OLLAMA_SIMWIN_URL }
  - model_name: local/embeddinggemma
    litellm_params: { model: ollama/embeddinggemma:300m-bf16, api_base: os.environ/OLLAMA_INNOVATION_URL }
    model_info: { mode: embedding }
  - model_name: openrouter/*
    litellm_params: { model: openrouter/*, api_key: os.environ/OPEN_ROUTER_API_KEY }
  - model_name: groq/*
    litellm_params: { model: groq/*, api_key: os.environ/GROQ_API_KEY }
  - model_name: gemini/*
    litellm_params: { model: gemini/*, api_key: os.environ/GOOGLE_AI_STUDIO_KEY }

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 300
  allowed_fails: 2
  cooldown_time: 60

litellm_settings:
  drop_params: true
  request_timeout: 300
  # Identical requests (same model, messages, params) are answered from Redis for a day; a caller opts out with
  # {"cache": {"no-cache": true}}.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 86400
    supported_call_types: [acompletion, completion, aembedding, embedding]
  # Every key gets a budget: by default $5 per 30 days, and no key may be minted above $50 per 30 days.
  default_key_generate_params:
    max_budget: 5
    budget_duration: 30d
  upperbound_key_generate_params:
    max_budget: 50
    budget_duration: 30d
    rpm_limit: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL   # keys, budgets and the usage log (LiteLLM_SpendLogs) live in Postgres
  store_model_in_db: false
  disable_spend_logs: false
  max_request_size_mb: 32
