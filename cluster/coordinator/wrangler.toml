# crane cluster coordinator, deployed at crane.lunarz.dev. See ../README.md ("Deploying").
name = "crane-cluster"
main = "src/index.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "crane.lunarz.dev", custom_domain = true }]

[vars]
MIN_CLIENT_VERSION = "0.1.0"   # fallback until PUT /v1/admin/client_release sets one
LEASE_TTL_SECONDS = "300"      # initial lease and each heartbeat extension
MAX_ATTEMPTS = "3"             # default per job; an expired or failed lease at this attempt goes to 'dead'
MAX_LEASE_JOBS = "4"           # cap on max_jobs per /v1/lease call
RAW_RETENTION_DAYS = "14"      # default retention of raw artifacts (PUT /v1/admin/retention overrides)
MAX_ARTIFACT_MB = "95"         # proxied uploads stay under the Workers request-body limit
FEED_CACHE_S = "5"             # the public feed's colo cache: viewers within this many seconds share one D1 read

ARCHIVE_URL = "https://crane-archive.lunarz.dev"   # the archive node's tunnel (../archive/README.md)
R2_SOFT_CAP_GB = "200"         # a lagging archive holds expired items in R2 until R2 use passes this
ARCHIVE_MAX_LAG_GB = "50"      # unarchived bytes past their hot window above which the archive counts as lagging

# Secrets (never put them here):
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put GITHUB_WEBHOOK_SECRET
#   npx wrangler secret put ARCHIVE_ACCESS_ID       (cloudflare_setup.py writes both to secrets.env)
#   npx wrangler secret put ARCHIVE_ACCESS_SECRET

[[d1_databases]]
binding = "DB"
database_name = "crane-cluster"
database_id = "be499d65-4b97-4c0e-bf0d-e6094f780afc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "crane-cluster-artifacts"

[triggers]
crons = ["*/5 * * * *"]   # reclaim expired leases, tier artifacts out of R2

[observability]
enabled = true
