<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crane runs</title>
<meta name="description" content="The crane cluster's run queue: what runs now, what waits, why, and how long it takes.">
<meta name="theme-color" content="#0F1217">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='4' y='4' width='8' height='8' rx='1.5' transform='rotate(45 8 8)' fill='%237DD3DC'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="modulepreload" href="app.js"><link rel="modulepreload" href="traj.js"><link rel="modulepreload" href="replay.js">
<style>
:root{
  --bg:#0F1217; --bg2:#0B0E12; --line:#20262F; --line2:#2C3542;
  --fg:#E4E8EF; --fg2:#A6B0C2; --mute:#7C8595; --faint:#3B4351;
  --accent:#7DD3DC; --ok:#8FD19E; --fail:#F0898C; --warn:#EDCB78; --zone:#C792EA;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);font-feature-settings:"tnum" 1;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.page{max-width:1120px;margin:0 auto;padding:0 32px}
header .page{display:flex;align-items:center;gap:32px;height:64px}
.mark{font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
.mark i{width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 12px rgba(125,211,220,.6)}
nav{display:flex;gap:22px;font-size:14px}
nav a{color:var(--mute);padding:4px 0;border-bottom:1px solid transparent}
nav a:hover{color:var(--fg)}
nav a[aria-current=page]{color:var(--fg);border-color:var(--accent)}
.clock{margin-left:auto;color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.clock i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:breathe 3s ease-in-out infinite}
.clock.stale i{background:var(--warn);animation:none} .clock.stale{color:var(--warn)}
.clock.err i{background:var(--fail);animation:none} .clock.err{color:var(--fail)}
.clock.wait i{background:var(--faint)}
@keyframes breathe{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lede{font-size:34px;line-height:1.2;font-weight:300;letter-spacing:-.02em;margin:44px 0 40px;max-width:30ch;text-wrap:balance}
.lede.sub{font-size:27px;max-width:40ch}
.lede em{font-style:normal;color:var(--accent)}
.lede .d{color:var(--mute)}
h2{font-size:13px;font-weight:500;color:var(--mute);margin:0 0 14px;display:flex;gap:10px;align-items:baseline}
h2 span{font-weight:400;color:var(--faint)}
section{margin-bottom:48px}
.mute{color:var(--mute)} .ok{color:var(--ok)} .bad{color:var(--fail)} .warn{color:var(--warn)} .r{text-align:right}

.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));border-top:1px solid var(--accent)}
.berth{padding:16px 22px 18px;display:flex;flex-direction:column;min-height:196px;border-left:1px solid var(--line);margin-left:-1px}
.berth .w{font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.berth .w b{color:var(--accent);font-weight:500}
.berth .p{font-size:17px;line-height:1.4;margin:10px 0 14px;flex:1;text-wrap:pretty}
a.berth:hover .p{color:#fff}
.berth .by{font-size:12.5px;color:var(--mute)}
.berth.idle .p{color:var(--mute)}
.prog{display:flex;gap:2px;height:6px;margin:12px 0 8px}
.prog i{flex:1;background:var(--line2);border-radius:1px}
.prog i.ok{background:var(--accent)} .prog i.f{background:var(--fail)}
.prog.cont{display:block;background:var(--line2);border-radius:1px;position:relative;overflow:hidden}
.prog.cont i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.berth .rem{display:flex;justify-content:space-between;font-size:13px;align-items:baseline}
.berth .rem b{font-weight:400;font-size:22px;letter-spacing:-.01em}

.list{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:64px 24px 1fr 200px;gap:0 14px;padding:15px 0;border-bottom:1px solid var(--line);align-items:baseline}
a.item:hover .p{color:#fff}
.item .t{font-size:15px;color:var(--fg2)}
.item .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.item .p{font-size:15px;line-height:1.45;max-width:70ch;text-wrap:pretty}
.m{font-size:12.5px;color:var(--mute);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.m b{font-weight:400;color:var(--fg2)}
.dur{align-self:center}
.dur .g{position:relative;height:14px}
.dur .g::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--line2)}
.dur .g i{position:absolute;top:4px;height:5px;left:0;border-radius:1px;background:var(--fg2)}
.dur .g u{position:absolute;top:1px;width:1px;height:12px;background:var(--warn)}
.dur .l{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:2px}
.dur .l b{font-weight:400;color:var(--fg)}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-family:var(--mono);padding:0 0 4px;margin-left:calc(100% - 200px)}
.stage{font-size:11.5px;padding:0 7px;border-radius:3px;background:#1B2333;color:#9CB8F2}
.stage.unity{background:#251C33;color:var(--zone)} .stage.real{background:#2D2716;color:var(--warn)}
details.more summary{cursor:pointer;color:var(--mute);font-size:13px;padding:14px 0;border-bottom:1px solid var(--line);list-style:none}
details.more summary:hover{color:var(--fg)}
details.legacy{opacity:.6}

.item.past .t{color:var(--mute);font-size:13px}
.verdict{font-size:14px;color:var(--fg2);margin-top:6px;padding-left:12px;border-left:2px solid var(--line2)}
.verdict.ok{border-color:var(--ok)} .verdict.bad{border-color:var(--fail);color:#E9B8BA}
.strip{display:flex;gap:1.5px;align-items:flex-end;height:22px;align-self:center;overflow:hidden}
.strip i{width:4px;flex:none;border-radius:1px;background:#3D6B55}
.strip i.f{background:var(--fail)}
.rp{font-size:12.5px;color:var(--accent)}
.st{font-size:13px} .st.done{color:var(--ok)} .st.failed,.st.dead{color:var(--fail)} .st.cancelled{color:var(--mute)} .st.running{color:var(--accent)} .st.queued{color:var(--fg2)}

.camp{padding:26px 0 30px;border-top:1px solid var(--line)}
.camp .hd{display:flex;align-items:baseline;gap:6px 14px;margin-bottom:6px;flex-wrap:wrap}
.camp .hd h3{margin:0;font-size:22px;font-weight:300;letter-spacing:-.01em}
.camp .hd span{color:var(--mute);font-size:13px}
.hyp{margin-top:18px}
.hyp .hn{font-size:14px;margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.metro{display:grid;grid-template-columns:150px repeat(3,1fr);align-items:center}
.metro .sh{font-size:11.5px;color:var(--mute);padding-bottom:4px;text-align:center}
.metro .arm{font-size:13px;color:var(--fg2);padding:9px 0;overflow-wrap:anywhere}
.metro .seg{position:relative;height:40px;display:flex;align-items:center;justify-content:center}
.metro .seg::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line2);transform:translateY(-50%)}
.metro .seg.reached::before{background:var(--accent)}
.metro .seg.first::before{left:50%} .metro .seg.last::before{right:50%}
.metro .seg.reached.edge::before{right:50%}
.metro .seg.reached.edge.first::before{display:none}
.stn{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line2)}
.stn.done{background:var(--accent);border-color:var(--accent)}
.stn.running{border-color:var(--accent);box-shadow:0 0 0 4px rgba(125,211,220,.15)}
.stn.queued{border-style:dashed;border-color:var(--fg2)}
.stn.failed,.stn.dead{border-color:var(--fail);background:var(--fail)}
.cap{position:absolute;top:calc(50% + 10px);font-size:11px;color:var(--mute);white-space:nowrap}
.flatlist .item{grid-template-columns:24px 1fr 120px}

.wk{display:grid;grid-template-columns:180px 1fr 220px;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start}
.wk h3{margin:0;font-weight:400;font-size:20px;display:flex;align-items:center;gap:10px}
.wk h3 i{width:8px;height:8px;border-radius:50%;background:var(--ok)} .wk h3 i.off{background:var(--faint)}
.wk .bk{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.7}
.wk .p{font-size:15px;display:block} .wk .prog{margin-top:12px}
.wk .ws{font-size:13px;color:var(--mute);text-align:right}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:400;color:var(--mute);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);font-size:12px}
.tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
.tbl .r{text-align:right}

.legend{font-size:12px;color:var(--mute);margin:-24px 0 24px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:12px;border-radius:1.5px;margin-left:8px}
.legend i:first-child{margin-left:0}
.grp{padding:16px 0;border-bottom:1px solid var(--line)}
.grp .p{font-size:14.5px}
.grp .p:hover{color:#fff}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ticks{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:10px;overflow:hidden}
.ticks a{width:9px;flex:none;border-radius:1.5px;display:block}
.win{background:var(--ok)} .f{background:var(--fail)} .ticks a.nr,.legend i.nr{opacity:.4}
.ticks a:hover{outline:1.5px solid var(--accent);outline-offset:1px}
.grp .m{margin-top:6px}

.back{display:inline-block;margin:28px 0 0;color:var(--mute);font-size:13px}
.back:hover{color:var(--fg)}
.jp{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;margin:20px 0 40px}
.purpose{font-size:26px;font-weight:300;line-height:1.3;letter-spacing:-.015em;margin:0 0 12px;max-width:36ch;text-wrap:pretty}
.jp .verdict{margin-top:16px}
.facts{font-size:13.5px}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.facts span{color:var(--mute)} .facts b{font-weight:400;text-align:right;overflow-wrap:anywhere}
.ebar{margin:20px 0}
.ebar h2{margin-bottom:6px}
.ebar .row{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center;font-size:12.5px;color:var(--fg2);margin:7px 0}
.ebar .row div{height:4px;background:var(--line);position:relative}
.ebar .row div i{position:absolute;left:0;top:0;bottom:0}
.stage-big{display:flex;gap:6px;margin:12px 0 0;font-size:12px;color:var(--mute)}
.stage-big span{padding:3px 9px;border:1px solid var(--line2);border-radius:3px}
.stage-big span.on{border-color:var(--accent);color:var(--accent)} .stage-big span.past{color:var(--fg2)}
.theater{background:var(--bg2);border:1px solid var(--line);border-radius:4px;margin-top:22px;position:relative}
.theater canvas{width:100%;height:440px;display:block}
.tcap{position:absolute;left:14px;top:12px;font-size:12px;color:var(--mute);pointer-events:none;line-height:1.6}
.tcap b{color:var(--fg);font-weight:400;font-size:14px}
.tctl{display:flex;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.pp{flex:none;width:28px;height:28px;border:1px solid var(--accent);color:var(--accent);border-radius:50%;display:grid;place-items:center;font-size:11px}
.tctl input{flex:1;min-width:60px;accent-color:var(--accent)}
.tt{min-width:76px;text-align:right}
.k button{padding:1px 5px;color:var(--mute)} .k button[aria-pressed=true]{color:var(--accent)}
.seedrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.seedrow a{font-family:var(--mono);font-size:11px;min-width:28px;padding:0 4px;height:22px;display:grid;place-items:center;border-radius:3px;background:#17201D;color:var(--ok)}
.seedrow a.f{background:#2A1B1F;color:var(--fail)} .seedrow a.nr{opacity:.4} .seedrow a.sel{outline:1.5px solid var(--accent)}
.evs{margin-top:16px;font-size:12.5px;max-height:260px;overflow-y:auto}
.evs button{display:grid;grid-template-columns:60px 1fr;width:100%;text-align:left;padding:4px 0;border-bottom:1px solid var(--line);color:var(--fg2)}
.evs button:hover{color:var(--accent)} .evs button.bad{color:var(--fail)}
.evs span{color:var(--mute)}
.nore{border:1px dashed var(--line2);border-radius:4px;padding:22px;color:var(--mute);margin-top:22px;font-size:13.5px}
#renders{margin-top:28px}
.vid{margin:0 0 14px} .vid video{width:100%;border-radius:4px;background:#000;display:block}
.vid figcaption{font-size:12.5px;color:var(--fg2);margin-top:6px} .vid a{color:var(--accent)}
.pend{font-size:13px;margin:0 0 10px}
.btn{border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:7px 12px;font-size:13px}
.btn:disabled{border-color:var(--line2);color:var(--faint);cursor:not-allowed}
.hint{font-size:12px;color:var(--faint);margin:6px 0 0}
#rqf{margin-top:12px;display:grid;gap:8px;font-size:12.5px;color:var(--mute)}
#rqf textarea{background:var(--bg2);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:8px;font:inherit;font-size:13px;resize:vertical}
#rqf .btn{justify-self:start}
#rqf[hidden]{display:none}
.fleg{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);margin-top:12px}
.fleg i{display:block;width:160px;height:6px;border-radius:3px}
footer{color:var(--faint);font-size:11.5px;padding:24px 0 40px;display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--mute)} footer a:hover{color:var(--fg)}

@media (max-width:860px){
  .page{padding:0 16px}
  header .page{gap:10px 16px;flex-wrap:wrap;height:auto;padding-top:12px;padding-bottom:8px}
  nav{order:3;width:100%;gap:18px;overflow-x:auto}
  .lede{font-size:26px;margin:28px 0}
  .lede.sub{font-size:22px}
  .now{grid-template-columns:1fr}
  .berth{padding:16px 0;border-left:0;margin-left:0;border-bottom:1px solid var(--line);min-height:0}
  .item{grid-template-columns:52px 1fr}
  .item .n{display:none}
  .item .dur,.item .strip{grid-column:2;margin-top:10px}
  .flatlist .item{grid-template-columns:24px 1fr}
  .flatlist .item .r{display:none}
  .jp{grid-template-columns:1fr}
  .wk{grid-template-columns:1fr;gap:10px} .wk .ws{text-align:left}
  .metro{grid-template-columns:90px repeat(3,1fr)}
  .scale{display:none}
  .theater canvas{height:320px}
  .k button[data-k="1"]{display:none}
}
</style>
</head>
<body>
<header><div class="page">
  <a class="mark" href="#/now"><i></i>crane</a>
  <nav id="nav" aria-label="Views"><a href="#/now">Now</a><a href="#/runs">Runs</a><a href="#/campaigns">Campaigns</a><a href="#/workers">Workers</a></nav>
  <div class="clock wait" id="clock" role="status"><i></i>connecting</div>
</div></header>
<main class="page" id="view"></main>
<footer class="page"><span>Public and read-only: the crane cluster’s run feed (crane-feed/1). Times are local.</span><a href="#" id="op">operator sign-in</a></footer>
<noscript><p class="page">This page needs JavaScript; the feed itself is at <a href="/v1/feed">/v1/feed</a>.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
