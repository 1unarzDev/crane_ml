# The boat domain: a public reference mission (entry gates, nav channel, U-turn, dock) over crane
# course truth. Each tier names its fastsim domain YAML (paths from the repo root).
#   python3 -m fastsim.batch --config domains/boat/fastsim_t1.yaml --seeds 0:5 --out runs/boat
tiers:
  T0: {config: domains/boat/fastsim_t0.yaml}
  T1:
    config: domains/boat/fastsim_t1.yaml
    # crane sim up --tier T1: the T1 twin as a live ROS world, in T2's ROS container (Docs/SimT1.md). Keys it does
    # not name come from tiers.T2 (host, ros image, container, mounts, restart recipe, next_up/next_down).
    sim:
      node: crane/sim/t1node.py                 # the rclpy node, mounted read-only into the container
      plant: Tools/Characterization/plant.py    # ProfilePlant (stdlib only); its folder is mounted beside the node
      card: characterized                       # the plant card when --card is not given (card.dir)
      odom: sensors                             # sensors: the real EKFs run on the raw topics; truth: no EKFs
      rate: 1                                   # x real time (--rate N)
      ready_marker: CRANE_T1_READY              # the node's log line: the world steps and publishes
      plant_marker: CRANE_T1_PLANT              # the node's log line: the plant card it steps
      ready_s: 60                               # how long up waits for ready_marker
      # The course truth for (family, seed, --set): the generator, else the committed truth (no --set).
      course: {generate: 'domains.boat.coursegen:truth', dir: domains/boat/courses, file: '{name}-s{seed}.json'}
      # What the player publishes and takes (CraneRoboBoatSensorContract, CraneROSNavigationState, ROSClock,
      # ROSThrusterPwmCommand, RoboBoatStartReset), rates in sim Hz. Lever arms come from the robot's urdf.
      world:
        command: {topic: /thrusters/pwm, timeout_ticks: 25}                 # FL,FR,RR,RL us; neutral after 25 ticks
        truth: {topic: /crane/odom, hz: 50}
        fcu: {topic: /odom/mavros, hz: 20}
        imu: {topic: /imu/raw, hz: 20, link: imu_link}
        gps: {topic: /gps/fix, hz: 5, link: gps_link, origin: [27.3747, -82.4518]}
        estimate: {local: /odom/local, global: /odom/global, hz: 50}       # --odom truth
        frames: {map: map, odom: odom, base: base_link}
        reset: /crane/reset_to_start
        noise: {gps_sigma: 0.0, fcu_velocity_sigma: 0.0, seed: 0}         # the player's defaults (m, m/s)
      ros:
        # device:=sim with the parts T1 has no inputs for turned off (mhseals_nav device_profile PART_KEYS).
        overrides:
          sensors: '{"parts": {"camera": {"enabled": false}, "lidar": {"enabled": false}, "objects": {"enabled": false}, "sim_bridge": {"enabled": false}}}'
          truth: '{"parts": {"camera": {"enabled": false}, "lidar": {"enabled": false}, "objects": {"enabled": false}, "sim_bridge": {"enabled": false}, "localization": {"enabled": false}}}'
        ready_nodes: {sensors: [ekf_local, bt_navigator], truth: [bt_navigator]}
  # T2: the Unity world, used like the boat (crane sim; crane/player.py builds the player argv from it).
  # crane adds the player's generic flags itself (-screen-*, -logFile, --crane-profile, --crane-scene,
  # --crane-ros-ip/--crane-ros-port); everything RoboBoat-specific is here.
  T2:
    scene: Roboboat Course
    profile: interactive-low                    # --crane-profile, the runtime quality (crane sim up --profile P)
    profiles: [custom, train-gpu, train-cpu, interactive-low, interactive-high, evaluation-high, replay-high]   # the player's (CraneRuntimeOptions)
    screen: [1280, 720]                         # the player window, and xvfb's screen when headless
    flags: [--crane-disable-sitl, --crane-ros-thruster-pwm, --crane-roboboat-contract, --crane-ros-nav-state,
            --crane-lidar-returns-only, --crane-lidar-water-level, '0.02']
    required_flag: --crane-roboboat-contract    # a player whose assemblies lack it cannot run this world
    truth: {flag: --crane-roboboat-course-truth, file: course_truth.json}   # the course truth, in the run dir
    # The Roboboat Course scene's water current, SPEED,TOWARD_DEG (m/s; toward, counter-clockwise from world +x
    # of /crane/odom): its water surface has largeCurrentSpeedValue 0.15 and HDRP orientation 0 (toward 270 deg).
    # --current X,Y overrides it; --current 0 is still water.
    current: {flag: --crane-water-current, default: '0.15,270'}
    set_flag: --crane-course-set                # --set k=v pins one course parameter
    seed: 1
    ready_marker: CRANE_ROBOBOAT_COURSE_READY   # the player log line: the course is built and running
    plant_marker: CRANE_PLANT_APPLIED           # the player log line: the plant card was applied
    ready_s: 300                                # how long up waits for ready_marker (SIM_UP_READY_S overrides)
    vessel: sim                                 # the astro vessel profile whose network.env names ROS_DOMAIN_ID
    # The host's robot tooling (astro) that this world stands in for: its checkout ({dock}), its vessel profiles,
    # the env that marks a ROS_DOMAIN_ID as exported by it, its copy of the heavy guard, and its own up command.
    # Each {env, default}: $env when set, else default (~ is $HOME).
    host:
      dock: {env: ASTRO_DOCK, default: '~/astro_dock'}
      profiles: {env: ASTRO_PROFILES, file: {env: ASTRO_PROFILES_CONFIG, default: '~/.config/astro/profiles.env',
                                             key: ASTRO_PROFILES}, default: '{dock}/profiles'}
      trust_domain_id: [ASTRO_STATE, MHSEALS_HARDWARE_CONFIG]   # ROS_DOMAIN_ID counts only beside one of these
      heavy: '{dock}/.handoff/tools/heavy'      # the guard when crane's bin/heavy is missing
      up: astro sim up
    ros:
      launch: mhseals_nav device.launch.py device:=sim      # ros2 launch ARGS, in the container
      overrides: '{"parts": {"sim_bridge": {"args": {"ros_port": "{port}"}}}}'
      container: sim_up_ros
      label: sim_up=1
      ip: 127.0.0.1
      port_base: 10000                          # the ROS-TCP endpoint: port_base + ROS_DOMAIN_ID
      endpoint_s: 60
      ready_nodes: [ekf_local, rtabmap, bt_navigator]
      ready_s: 120                              # crane sim restart ros: how long to wait for ready_nodes
      # crane sim restart nav: the navigation part alone, in the running container, so new nav2_limits in the
      # state take effect. navigation.launch.py reads them at launch (compile_navigation); the device profile
      # resolves the same args as the first launch (only:=navigation), so nothing else is started or touched.
      # stop/alive/kill run through docker exec without a shell; start runs detached in bash (BASH_ENV sets up
      # ROS) and appends to the ros log. {match} is a regex over the nav nodes' `__node:=NAME` launch argument
      # (exact names, so never the launch itself, the EKFs, SLAM, the object tracker or the ROS-TCP endpoint).
      restart:
        nav:
          match: '__node:=(controller_server|planner_server|behavior_server|bt_navigator|waypoint_follower|velocity_smoother|lifecycle_manager_navigation)( |$)'
          stop: ['pkill -TERM -f -- {match}']
          alive: 'pgrep -f -- {match}'              # exit 0 while any is left
          kill: ['pkill -KILL -f -- {match}']
          stop_s: 20                                # TERM, then this long, then KILL; then the same again
          start: ['ros2 launch {launch} only:=navigation overrides:={overrides}']
          ready: {nodes: [bt_navigator], state: 'ros2 lifecycle get /{node}', expect: active}
          ready_s: 90
      # The container mirrors the dev container (.devcontainer/docker-compose.yml of the dock), so `astro on
      # sim` works inside it. {dock} ASTRO_DOCK, {ws} workspace, {run} the state dir, {home} $HOME.
      image: {env: ASTRO_IMAGE, compose: .devcontainer/docker-compose.yml}
      user: roboboat
      home: /home/roboboat                      # the user's home in the container
      workspace: /home/roboboat/roboboat_ws
      # The state path the host tooling exports (astro: the sim state, with its nav2_limits), passed in with a
      # leading $HOME mapped to the container's home, so Nav2 and the drivers read the sim's state, never a boat's.
      state_env: [ASTRO_STATE, MHSEALS_HARDWARE_CONFIG]
      env: ['ROS_WS={ws}', 'BASH_ENV={ws}/.devcontainer/dev.bashrc',
            'FASTRTPS_DEFAULT_PROFILES_FILE={ws}/config/fastdds.xml', 'FASTDDS_DEFAULT_PROFILES_FILE={ws}/config/fastdds.xml']
      mounts: ['{dock}:{ws}', '{run}:{run}', '{home}/.config/mhseals:/home/roboboat/.config/mhseals',
               '{home}/.config/astro:/home/roboboat/.config/astro']
      dirs: ['{home}/.config/mhseals', '{home}/.config/astro', '{dock}/bags/sim']
    # What the status block suggests next, while the sim runs and once it is down.
    next_up: ['astro on sim', 'ros2 launch mhseals_hardware drive.launch.py output_backend:=topic use_sim_time:=true',
              'astro rec start ... ; astro test ... ; astro trial ...   (astro sim down when done)']
    next_down: ['astro sim up']
# --env KIND:NAME: the world a run uses. A course is generated by the player from (family, seed).
env:
  default: course:roboboat_2026
  kinds:
    # list: the families crane sim up --list env offers (a glob from the repo root; NAME is the file name to its dot)
    course: {T2: [--crane-course-family, '{name}', --crane-course-seed, '{seed}'],
             list: Assets/Config/Course/Resources/*.constraints.json}
# --robot R: the domain's robots; a robot may name its own card and extra player flags.
robot:
  default: blastoise
  robots: {blastoise: {urdf: 'Assets/Robot Descriptions/blastoise/blastoise.urdf'}}   # urdf: T1's sensor lever arms
# --card REF: a plant profile JSON, or a name in dir (REF.json). T2 hands it to the player.
card:
  dir: Tools/Characterization/profiles
  T2: {flag: --crane-boat-profile-json}
judge:
  pack: roboboat_course
# crane.env.make('boat', ...): the Gym-style batched env (Docs/Env.md). Actions: body-velocity setpoints through the
# plant's velocity loop (bounds: the tier config's limits.vmin/vmax), or the four thrusters' PWM straight to the T1
# plant. Obs channels: pose, vel, goal (body-frame offset to the next goal of the course route, approach and berth),
# perception (the camera's visible targets). Reward: progress toward the goal (m) plus the weights per event.
gym:
  action: velocity
  actions:
    velocity: {channels: [surge, sway, yaw], unit: [m/s, m/s, rad/s]}
    pwm: {channels: [pwm0, pwm1, pwm2, pwm3], low: 1100, high: 1900, unit: us}
  obs: [pose, vel, goal]
  reward: {progress: 1.0, goal: 1.0, contact: -5.0, step: 0.0, success: 10.0}
# How crane view draws the boat and what its live-mode sliders reach (crane/view/spec.py documents the keys).
view:
  frame: {world: enu, origin: scenario, body: flu}
  outline: [[0.62, 0.0], [0.4, 0.45], [-0.53, 0.45], [-0.53, -0.45], [0.4, -0.45]]   # 1.06 m x 0.9 m, bow +x
  layers: [boundary, footprints, gates, elements, constraints]
  lanes: {phase: mission, docked: mission, retry: mission, failed: mission, goal: goal}
  card: [vehicle.profile, adapter.options.profile]
  current: {T1: vehicle.current}      # T1 takes the current in the plant; T0 drifts kinematically
  params:
    - {name: current_speed, label: current speed, unit: m/s, min: 0.0, max: 1.0, step: 0.05, default: 0.0, bind: 'disturbance:current_speed'}
    - {name: current_toward, label: current toward, unit: deg, min: -180, max: 180, step: 5, default: 0, bind: 'disturbance:current_toward'}
    - {name: delay, label: plant delay, unit: s, min: 0.0, max: 0.6, step: 0.02, default: 0.0, bind: 'disturbance:delay_s'}
    - {name: pose_noise, label: pose noise, unit: m, min: 0.0, max: 1.0, step: 0.05, default: 0.0, bind: 'disturbance:pose_noise_m'}
    - {name: yaw_noise, label: heading noise, unit: deg, min: 0.0, max: 20.0, step: 0.5, default: 0.0, bind: 'disturbance:yaw_noise_deg'}
    - {name: gain, label: heading gain, unit: 1/s, min: 0.2, max: 3.0, step: 0.1, default: 1.0, bind: 'config:vehicle.gain'}
    - {name: cruise, label: cruise speed, unit: m/s, min: 0.3, max: 2.5, step: 0.05, default: 1.5, bind: 'config:limits.vmax.0'}
    - {name: tau_surge, label: surge lag, unit: s, min: 0.05, max: 3.0, step: 0.05, default: 0.65, bind: 'config:vehicle.tau_s.0', tiers: [T0]}
    - {name: kp_surge, label: surge loop kp, unit: 1/s, min: 0.0, max: 6.0, step: 0.1, default: 2.0, bind: 'config:vehicle.kp.0', tiers: [T1]}
    - {name: mass, label: card mass, unit: kg, min: 10.0, max: 80.0, step: 1.0, default: 30.0, bind: 'card:mass', tiers: [T1]}
    - {name: surge_d2, label: card surge d2, unit: N s2/m2, min: 2.0, max: 60.0, step: 0.5, default: 19.4, bind: 'card:surge.d2Pos', tiers: [T1]}
